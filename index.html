<style>
:root {
  --bg:         #0c0a07;
  --surf:       #171209;
  --surf2:      #211a0e;
  --border:     #302515;
  --gold:       #c9a84c;
  --gold-hi:    #e6ca78;
  --gold-dim:   rgba(201,168,76,.18);
  --text:       #ece6da;
  --sub:        #a0906e;
  --muted:      #5a4e38;
  --promo-bg:   #1a1205;
  --promo-ring: rgba(201,168,76,.35);
  --tag-on:     #0c0a07;
  --add-bg:     rgba(201,168,76,.12);
  --add-hover:  rgba(201,168,76,.25);
  --drawer-bg:  #13100a;
  body { background: var(--bg); color: var(--text); }
}
@media (prefers-color-scheme: light) {

    --bg:         #f5f0e6;
    --surf:       #ede5d2;
    --surf2:      #e4d9c4;
    --border:     #cec0a0;
    --gold:       #8a6b20;
    --gold-hi:    #7a5c18;
    --gold-dim:   rgba(138,107,32,.12);
    --text:       #1a1209;
    --sub:        #6b5830;
    --muted:      #bdb09a;
    --promo-bg:   #ede5d2;
    --promo-ring: rgba(138,107,32,.4);
    --tag-on:     #f5f0e6;
    --add-bg:     rgba(138,107,32,.1);

}
:root[data-theme="light"] {
  --bg:         #f5f0e6;
  --surf:       #ede5d2;
  --surf2:      #e4d9c4;
  --border:     #cec0a0;
  --gold:       #8a6b20;
  --gold-hi:    #7a5c18;
  --gold-dim:   rgba(138,107,32,.12);
  --text:       #1a1209;
  --sub:        #6b5830;
  --muted:      #bdb09a;
  --promo-bg:   #ede5d2;

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; padding-inline: 0; min-height: 100%; }

/* ── HEADER ── */
.hdr { position: sticky; top: env(safe-area-inset-top,0px); z-index: 80;
  background: var(--surf); border-bottom: 1px solid var(--border); padding: 14px 20px 12px; }
.hdr-inner { max-width: 860px; margin: auto; display: flex; align-items: center;
  justify-content: space-between; gap: 12px; }
.brand { display: flex; flex-direction: column; gap: 1px; }
.brand-name { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; font-weight: 600;
  color: var(--gold); letter-spacing: .02em; line-height: 1; }
.brand-line { font-size: 11px; color: var(--sub); letter-spacing: .04em; margin-top: 3px; }
.hdr-right { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.chip { font-size: 11px; color: var(--sub); background: var(--surf2); border: 1px solid var(--border);
  border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
.chip b { color: var(--text); font-weight: 500; }

/* basket button in header */
.basket-btn { position: relative; background: var(--add-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; color: var(--text);
  display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500;
  transition: background .15s, border-color .15s; white-space: nowrap; }
.basket-btn:hover { background: var(--add-hover); border-color: var(--gold); }
.basket-btn.has-items { border-color: var(--gold); color: var(--gold); }
.basket-count { background: var(--gold); color: var(--tag-on); border-radius: 99px;
  font-size: 10px; font-weight: 700; padding: 1px 6px; min-width: 18px; text-align: center; }
.basket-count[hidden] { display: none!important; }

/* ── PROMO ── */
.promo-wrap { padding: 14px 20px 0; max-width: 860px; margin: 14px auto 0; }
.promo-label { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 11px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px; }
.promo-label::after { content: ''; flex: 1; height: 1px; background: var(--promo-ring); }
.promo-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.promo-scroll::-webkit-scrollbar { display: none; }
.promo-card { flex-shrink: 0; background: var(--promo-bg); border: 1px solid var(--promo-ring);
  border-radius: 8px; padding: 10px 14px; min-width: 160px; max-width: 180px; cursor: pointer;
  transition: border-color .15s; }
.promo-card:hover { border-color: var(--gold); }
.promo-card-name { font-size: 12px; font-weight: 500; line-height: 1.3; margin-bottom: 3px; }
.promo-card-sub { font-size: 10px; color: var(--sub); }
.promo-card-price { font-size: 15px; font-weight: 500; color: var(--gold); font-variant-numeric: tabular-nums; margin-top: 6px; }
.promo-card-price small { font-size: 10px; color: var(--sub); font-weight: 400; }
.promo-card-add { margin-top: 8px; width: 100%; background: var(--add-bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px; font-size: 11px; color: var(--gold); cursor: pointer;
  transition: background .12s; text-align: center; }
.promo-card-add:hover { background: var(--add-hover); }

/* ── CONTROLS ── */
.ctrl-wrap { padding: 14px 20px 0; max-width: 860px; margin: 0 auto; }
.search-ring { display: flex; align-items: center; gap: 8px; background: var(--surf2);
  border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; margin-bottom: 10px;
  transition: border-color .15s; }
.search-ring:focus-within { border-color: var(--gold); }
.search-ring svg { flex-shrink: 0; color: var(--muted); }
.search-ring input { background: transparent; border: none; outline: none; color: var(--text); font: inherit; width: 100%; }
.search-ring input::placeholder { color: var(--muted); }
.tags { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.tags::-webkit-scrollbar { display: none; }
.tag { flex-shrink: 0; font-size: 12px; background: var(--surf2); border: 1px solid var(--border);
  border-radius: 99px; padding: 5px 13px; color: var(--sub); cursor: pointer;
  transition: all .12s; white-space: nowrap; }
.tag:hover { color: var(--text); border-color: var(--gold); }
.tag.on { background: var(--gold); border-color: var(--gold); color: var(--tag-on); font-weight: 500; }

.meta-row { padding: 8px 20px 0; max-width: 860px; margin: 0 auto; font-size: 11px; color: var(--muted); }

/* ── CATALOG ── */
.catalog { max-width: 860px; margin: 10px auto 0; padding: 0 20px 100px; }
.section { margin-bottom: 28px; }
.section-hd { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 11px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--gold);
  padding-block: 6px; border-bottom: 1px solid var(--border); margin-bottom: 2px; }
.row { display: flex; align-items: center; gap: 10px; padding: 7px 0;
  border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: none; }
.row-name { font-size: 13px; line-height: 1.35; flex: 1; }
.row-size { font-size: 10px; color: var(--sub); margin-left: 5px; }
.row-price { font-size: 13px; font-weight: 500; color: var(--gold-hi);
  font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; min-width: 52px; }
.row-price sub { font-size: 9px; color: var(--sub); font-weight: 400; vertical-align: baseline; }
/* in-basket indicator */
.row.in-basket .row-name { color: var(--gold-hi); }

/* add button */
.add-btn { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
  background: var(--add-bg); border: 1px solid var(--border); color: var(--gold);
  cursor: pointer; font-size: 16px; line-height: 1; display: flex; align-items: center;
  justify-content: center; transition: background .12s, border-color .12s, transform .1s;
  font-weight: 300; padding-bottom: 1px; }
.add-btn:hover { background: var(--add-hover); border-color: var(--gold); }
.add-btn:active { transform: scale(.88); }
.add-btn.in { background: var(--gold); border-color: var(--gold); color: var(--tag-on); font-size: 13px; font-weight: 700; }

.no-res { text-align: center; padding: 48px 0; color: var(--muted); font-style: italic; }

/* ── BASKET DRAWER ── */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200;
  opacity: 0; pointer-events: none; transition: opacity .25s; }
.backdrop.open { opacity: 1; pointer-events: all; }

.drawer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 201;
  background: var(--drawer-bg); border-top: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.32,.72,0,1);
  max-height: 80vh; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer.open { transform: translateY(0); }

.drawer-hd { display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.drawer-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px;
  font-weight: 600; color: var(--gold); }
.drawer-close { background: var(--surf2); border: 1px solid var(--border); border-radius: 50%;
  width: 28px; height: 28px; cursor: pointer; color: var(--sub); font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: color .12s; }
.drawer-close:hover { color: var(--text); }

.drawer-items { overflow-y: auto; flex: 1; padding: 8px 0; }
.basket-empty { padding: 32px 20px; text-align: center; color: var(--muted); font-style: italic; font-size: 13px; }

.bitem { display: flex; align-items: center; gap: 10px; padding: 10px 20px;
  border-bottom: 1px solid var(--border); }
.bitem:last-child { border-bottom: none; }
.bitem-info { flex: 1; min-width: 0; }
.bitem-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bitem-size { font-size: 10px; color: var(--sub); }
.bitem-line { font-size: 11px; color: var(--sub); font-variant-numeric: tabular-nums; }

.qty-ctrl { display: flex; align-items: center; gap: 0; flex-shrink: 0; }
.qty-btn { width: 28px; height: 28px; background: var(--surf2); border: 1px solid var(--border);
  color: var(--text); cursor: pointer; font-size: 15px; display: flex; align-items: center;
  justify-content: center; transition: background .1s; line-height: 1; }
.qty-btn:first-child { border-radius: 6px 0 0 6px; }
.qty-btn:last-child { border-radius: 0 6px 6px 0; }
.qty-btn:hover { background: var(--add-hover); }
.qty-val { min-width: 32px; text-align: center; font-size: 13px; font-weight: 500;
  font-variant-numeric: tabular-nums; background: var(--surf2);
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 4px 2px; }
.bitem-del { flex-shrink: 0; background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 16px; padding: 4px; line-height: 1; transition: color .12s; }
.bitem-del:hover { color: #e05; }

.drawer-ft { flex-shrink: 0; border-top: 1px solid var(--border); padding: 14px 20px; }
.drawer-total { display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 12px; }
.drawer-total-label { font-size: 13px; color: var(--sub); }
.drawer-total-val { font-size: 20px; font-weight: 600; color: var(--gold);
  font-family: 'Cormorant Garamond', Georgia, serif; font-variant-numeric: tabular-nums; }
.drawer-total-val sub { font-size: 11px; color: var(--sub); font-weight: 400;
  font-family: 'DM Sans', sans-serif; vertical-align: baseline; }

.wa-btn { width: 100%; background: #25d366; border: none; border-radius: 10px; padding: 13px;
  color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; display: flex;
  align-items: center; justify-content: center; gap: 8px; transition: background .15s;
  text-decoration: none; box-sizing: border-box; }
.wa-btn:hover { background: #1ebe5d; }
.wa-btn svg { flex-shrink: 0; }
.clear-btn { width: 100%; background: none; border: none; color: var(--muted); font-size: 11px;
  cursor: pointer; padding-top: 10px; transition: color .12s; }
.clear-btn:hover { color: #e05; }

/* ── FOOTER ── */
.foot { background: var(--surf); border-top: 1px solid var(--border);
  padding: 18px 20px calc(18px + env(safe-area-inset-bottom,0px)); text-align: center; }
.foot-inner { max-width: 860px; margin: auto; }
.foot-cta { font-size: 13px; margin-bottom: 4px; }
.foot-cta a { color: var(--gold); text-decoration: none; font-weight: 500; }
.foot-ig { font-size: 12px; color: var(--sub); }
.foot-date { font-size: 10px; color: var(--muted); margin-top: 8px; }

@media (max-width: 500px) {
  .hdr { padding: 12px 16px 10px; }
  .hdr-chips { display: none; }
  .promo-wrap, .ctrl-wrap, .catalog, .meta-row { padding-inline: 16px; }
  .brand-name { font-size: 20px; }

// ── BASKET STATE ──
const basket = {}; // key → { name, size, price, qty }

function key(n,s){ return `${n}||${s}`; }

function addItem(name, size, price){
  const k = key(name,size);
  if(basket[k]) basket[k].qty++;
  else basket[k] = {name,size,price,qty:1};
  syncBasket();
  openDrawer();
}

function changeQty(k, delta){
  if(!basket[k]) return;
  basket[k].qty += delta;
  if(basket[k].qty <= 0) delete basket[k];
  syncBasket();
}

function removeItem(k){
  delete basket[k];
  syncBasket();
}

function clearBasket(){
  Object.keys(basket).forEach(k => delete basket[k]);
  syncBasket();
  closeDrawer();
}

function totalQty(){ return Object.values(basket).reduce((s,v)=>s+v.qty,0); }
function totalPrice(){ return Object.values(basket).reduce((s,v)=>s+(v.price*v.qty),0); }

function syncBasket(){
  const qty = totalQty();
  const countEl = document.getElementById('basket-count');
  const toggleEl = document.getElementById('basket-toggle');
  countEl.hidden = qty === 0;
  countEl.textContent = qty;
  toggleEl.classList.toggle('has-items', qty > 0);

  renderDrawer();
  // update add-btn states in catalog
  document.querySelectorAll('.add-btn').forEach(b => {
    const k = b.dataset.key;
    const inB = !!basket[k];
    b.classList.toggle('in', inB);
    b.textContent = inB ? basket[k].qty : '+';
    b.setAttribute('title', inB ? `${basket[k].qty} in basket — click to add more` : 'Add to basket');
  });
}

function renderDrawer(){
  const items = Object.entries(basket);
  const drawerItems = document.getElementById('drawer-items');
  const drawerFt = document.getElementById('drawer-ft');
  const drawerTotal = document.getElementById('drawer-total');

  if(items.length === 0){
    drawerItems.innerHTML = '<div class="basket-empty">Your basket is empty.</div>';
    drawerFt.hidden = true;
    return;
  }

  drawerFt.hidden = false;
  drawerTotal.innerHTML = `${totalPrice().toLocaleString()}<sub>k</sub>`;

  drawerItems.innerHTML = items.map(([k,v]) => `
    <div class="bitem">
      <div class="bitem-info">
        <div class="bitem-name">${v.name}</div>
        <div class="bitem-size">${v.size}</div>
        <div class="bitem-line">${v.price.toLocaleString()}k × ${v.qty} = ${(v.price*v.qty).toLocaleString()}k</div>
      </div>
      <div class="qty-ctrl">
        <button class="qty-btn" data-key="${k}" data-d="-1">−</button>
        <div class="qty-val">${v.qty}</div>
        <button class="qty-btn" data-key="${k}" data-d="1">+</button>
      </div>
      <button class="bitem-del" data-key="${k}" title="Remove">✕</button>
    </div>`).join('');

  drawerItems.querySelectorAll('.qty-btn').forEach(b =>
    b.addEventListener('click', () => changeQty(b.dataset.key, parseInt(b.dataset.d))));
  drawerItems.querySelectorAll('.bitem-del').forEach(b =>
    b.addEventListener('click', () => removeItem(b.dataset.key)));
}

// ── DRAWER TOGGLE ──
function openDrawer(){
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}
document.getElementById('basket-toggle').addEventListener('click', openDrawer);
document.getElementById('drawer-close').addEventListener('click', closeDrawer);
document.getElementById('backdrop').addEventListener('click', closeDrawer);
document.getElementById('clear-btn').addEventListener('click', clearBasket);

// ── WHATSAPP ORDER ──
document.getElementById('wa-btn').addEventListener('click', function() {
  const lines = Object.values(basket).map(v =>
    `• ${v.qty}x ${v.name} ${v.size} — ${(v.price*v.qty).toLocaleString()}k`).join('\n');
  const total = totalPrice().toLocaleString();
  const msg = `Halo Mickysonline! 🥃\n\nI'd like to order:\n${lines}\n\n*Total: ${total}k*\n\nNama:\nAlamat:\nPembayaran:`;
  this.href = `https://wa.me/628119788269?text=${encodeURIComponent(msg)}`;
});

  card.className = 'promo-card';
  card.innerHTML = `
    <div class="promo-card-name">${p.name}</div>
    <div class="promo-card-sub">${p.size} · buy 2</div>
    <div class="promo-card-price">${p.price.toLocaleString()}<small>k</small></div>
    <button class="promo-card-add">+ Add to basket</button>`;
  card.querySelector('.promo-card-add').addEventListener('click', e => {
    e.stopPropagation();
    addItem(p.name + ' ★Promo', p.size, p.price);
  });
  ps.appendChild(card);
});

// ── CATEGORY TAGS ──
const cats = [...new Set(ALL.map(i=>i.c))];
const tEl = document.getElementById('tags');
tEl.insertAdjacentHTML('beforeend','<button class="tag on" data-c="All">All</button>');
cats.forEach(c => tEl.insertAdjacentHTML('beforeend',`<button class="tag" data-c="${c}">${c}</button>`));

let activeCat = 'All';
tEl.addEventListener('click', e=>{
  const b = e.target.closest('.tag'); if(!b) return;
  activeCat = b.dataset.c;
  tEl.querySelectorAll('.tag').forEach(t=>t.classList.toggle('on', t.dataset.c===activeCat));
  render();
});
document.getElementById('q').addEventListener('input', render);

function fmt(n){ return n.toLocaleString(); }

function render(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  const items = ALL.filter(i=>{
    return (activeCat==='All' || i.c===activeCat) &&
           (!q || i.n.toLowerCase().includes(q) || i.c.toLowerCase().includes(q));
  });

  document.getElementById('meta').textContent = items.length
    ? `${items.length} item${items.length!==1?'s':''}`
    : '';

  const el = document.getElementById('catalog');
  if(!items.length){ el.innerHTML='<p class="no-res">No items match.</p>'; return; }

  const groups={};
  items.forEach(i=>{ (groups[i.c]??=[]).push(i); });

  el.innerHTML = Object.entries(groups).map(([cat,list])=>`
    <div class="section">
      <div class="section-hd">${cat}</div>
      ${list.map(i=>{
        const k = key(i.n,i.s);
        const inB = !!basket[k];
        return `<div class="row${inB?' in-basket':''}">
          <div class="row-name">${i.n}<span class="row-size">${i.s}</span></div>
          <div class="row-price">${fmt(i.p)}<sub>k</sub></div>
          <button class="add-btn${inB?' in':''}" data-key="${k}" data-n="${i.n}" data-s="${i.s}" data-p="${i.p}"
            title="${inB?`${basket[k].qty} in basket`:'Add to basket'}">${inB?basket[k].qty:'+'}</button>
        </div>`;
      }).join('')}
    </div>`).join('');

  el.querySelectorAll('.add-btn').forEach(b => b.addEventListener('click', () =>
    addItem(b.dataset.n, b.dataset.s, parseInt(b.dataset.p))
  ));
}

render();
</script>
